name: json-schema-validator-regen-policies
project:
  repo: /Users/donggi/_projects/experiment-projects/json-schema-validator
  language: java
  build: maven
  module: .
  test_framework: junit5
anchor: 1.1.0
range:
  branch: origin/master
  end: 1b57102e7c13acbfc9c82be20693efafb3983256
  mode: first-parent
  limit: null
  skip_untouched: main-sources
scope:
  rule: change-ranked
  min_methods: 3
  exclude_accessor_heavy: true
  target_methods:
  - 50
  - 80
  max_classes: 10
  classes: []
  min_classes: 1
dev:
  stable_runs: 3
  groups:
  - name: dev
    denominator: project
  - name: dev-scope
    display: Dev (scope)
    denominator: coverage-scoped
    derive_from: dev
model:
  provider: openrouter
  name: openai/gpt-oss-120b
  env_file: /Users/donggi/_projects/experiment-projects/KTester/docker/.env
  env_key: OPENROUTER_API_KEY
generators:
- name: ktester
  display: KTester
  method: ktester
  impl: author-tool
  tool_path: /Users/donggi/_projects/experiment-projects/KTester
  params:
    fix_tries: 5
    temperature: 0.5
    workers: 8
  rounds:
    max: 1
- name: ouedraogo
  display: "Ou\xE9draogo"
  method: ouedraogo
  impl: native
  params:
    prompts:
    - ZSL
    - FSL
    - CoT
    - ToT
    - GToT
    temperature: 0.7
    max_tokens: 16384
  rounds:
    max: 3
    until_dev_matched: true
    stop_after_zero_compile: 0
- name: ouedraogo-adj
  display: "Ou\xE9draogo (adjusted)"
  method: ouedraogo
  impl: native
  params:
    prompts:
    - ZSL
    - FSL
    - CoT
    - ToT
    - GToT
    temperature: 0.7
    max_tokens: 16384
  rounds:
    max: 1
  context:
    dependency_signatures:
      enabled: true
      max_types: 15
      max_lines: 400
  prompt:
    api_constraint: true
  postprocess:
    import_repair:
      enabled: true
      passes: 2
- name: ouedraogo-adj2
  display: "Ou\xE9draogo (adjusted 2)"
  method: ouedraogo
  impl: native
  params:
    prompts:
    - ZSL
    - FSL
    - CoT
    - ToT
    - GToT
    temperature: 0.7
    max_tokens: 16384
  rounds:
    max: 1
  context:
    dependency_signatures:
      enabled: true
      max_types: 15
      max_lines: 400
  prompt:
    api_constraint: true
  postprocess:
    import_repair:
      enabled: true
      passes: 2
screen:
  stable_runs: 3
  dedup: exact-body
  matching: none
survival:
  definition: cumulative-fixed-denominator
  flaky_rerun: 1
  build_fail: carry-over
  environment_errors:
    patterns:
    - java.net.BindException
    max_reruns: 3
    backoff_seconds: 5
coverage:
  changed_line: true
  at_anchor: true
  groups: alive-entering
runner:
  docker:
    compose_files:
    - /Users/donggi/_projects/experiment-projects/KTester/docker/compose.yml
    - /Users/donggi/_projects/experiment-projects/KTester/docker/compose.commit-survival.yml
    service: ktester
    mounts:
      /Users/donggi/_projects/experiment-projects/json-schema-validator: /repo
      /Users/donggi/_projects/experiment-projects/KTester: /work
  reuse:
    checkouts: /Users/donggi/_projects/experiment-projects/json-schema-validator/experiments/commit-survival/checkouts
    classpath_cache: null
  workers:
    build: 4
    survive: 2 
    cover: 2 
  timeouts:
    build: 600
    compile: 300
    test_class: 120
  jvm:
    launcher: 1g
    javac: 512m
    jacoco: 1g
  cache:
    classpath: pom-sha256
    node_modules: lockfile-sha256
policies:
  regenerate_developer: false
  baseline: experiments/commit-survival-run2
  baseline_config: experiments/commit-survival-replay-followup/experiment.yaml
  groups:
  - dev-scope
  - ktester
  - ouedraogo-adj2
  releases:                       # 2.0.0 replaced by 1.5.9 (10-29): all 5 scope classes are renamed/moved at 2.0.0
  - 1.5.0
  - 1.5.9
  threshold: 0.5
  max_threshold_triggers: 1
  generator_overrides:
    ktester:
      params:
        fix_tries: 3
  concurrency:
    ktester: 3
    ouedraogo-adj2: 3
    dev_selection: 1
  fill_seed: 20261029
  set:
  - name: release-reset
    trigger: release
    action: reset
  - name: half-reset
    trigger: threshold
    action: reset
  - name: half-fill
    trigger: threshold
    action: fill
